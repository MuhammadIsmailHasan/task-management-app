# The server's port 80 is published as 8082.
# One origin, one Next.js process (Requirement 46, V17): the landing page is `/`, the app is `/app/...`, and the API
# is `/app/api/...`. Flask keeps its `/api/...` routes: the trailing slash on proxy_pass swaps the `/app/api/` prefix for
# `/api/`. The bare `/api/` answers 404 so the Backend is reachable at one path only.
# The host name is optional: the server IP and port 8082 work too (DEP-13). Change `server_name` if the domain changes.
server {
    listen 80 default_server;
    server_name revoboard.belajardeploy.web.id _;

    client_max_body_size 3m;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;

    location /api/ {
        return 404;
    }

    location /app/api/ {
        proxy_pass http://127.0.0.1:5001/api/;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
