# The server's port 80 is published as 8082.
# Two names, one Next.js process (Requirement 42): the Site_Host serves the landing page and nothing of the API;
# every other host (the App_Host, the server IP, localhost) is the app and gets /api/ too.
# Change the name below if the domain changes, and set SITE_URL and APP_URL in /srv/revoboard/.env to match.
server {
    listen 80;
    server_name revoboard.belajardeploy.web.id;

    client_max_body_size 3m;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;

    location /api/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

server {
    listen 80 default_server;
    server_name app.revoboard.belajardeploy.web.id _;

    client_max_body_size 3m;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
