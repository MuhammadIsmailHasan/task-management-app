; supervisord is started with the server container, so this is what brings everything back after a reboot.
[program:revoboard-base]
command=/bin/sh -c "service postgresql start; service nginx start"
autostart=true
autorestart=false
startsecs=0
priority=10

[program:dockerd]
; The pid files survive a container restart and would block the start.
command=/bin/sh -c "rm -f /var/run/docker.pid /var/run/docker/containerd/containerd.pid; exec dockerd"
autostart=true
autorestart=true
startsecs=5
priority=20
redirect_stderr=true
stdout_logfile=/var/log/dockerd.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
