; supervisord starts with the server container, so this is what brings everything back after a reboot.
[program:revoboard-base]
command=/bin/sh -c "service postgresql start; service nginx start"
autostart=true
autorestart=false
startsecs=0
priority=10

[group:revoboard]
programs=backend,scheduler,frontend

[program:backend]
command=/srv/revoboard/app/deploy/bare/run.sh backend
user=ubuntu
environment=HOME="/home/ubuntu"
autostart=true
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
priority=20
redirect_stderr=true
stdout_logfile=/var/log/revoboard-backend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:scheduler]
command=/srv/revoboard/app/deploy/bare/run.sh scheduler
user=ubuntu
environment=HOME="/home/ubuntu"
autostart=true
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
priority=30
redirect_stderr=true
stdout_logfile=/var/log/revoboard-scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:frontend]
command=/srv/revoboard/app/deploy/bare/run.sh frontend
user=ubuntu
environment=HOME="/home/ubuntu"
autostart=true
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
priority=20
redirect_stderr=true
stdout_logfile=/var/log/revoboard-frontend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
